# DOSBox-X configuration of the instrumented X-Wing reference runs (tools/pc_run.py).
# Adapted from Secret Weapons of the Luftwaffe's reference/dosbox-x.conf: the DOS reference
# machine (docs/dos-reference.md) with AdLib only; P10's Sound Blaster machine is
# reference/dosbox-x-sb.conf.

[sdl]
fullscreen = false
output = surface
autolock = false

[dosbox]
machine = svga_s3
memsize = 16
quit warning = false

[cpu]
core = normal
cputype = 386
cycles = fixed 30000
# removes only the real-time throttle (docs/dos-reference.md)
turbo = true

[mixer]
nosound = true

[sblaster]
sbtype = none
oplmode = opl2

[log]
logfile = dosbox-x.log
