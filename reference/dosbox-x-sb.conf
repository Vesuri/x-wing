# DOSBox-X configuration of the instrumented X-Wing reference runs (tools/pc_run.py).
# Adapted from Secret Weapons of the Luftwaffe's reference/dosbox-x.conf: the DOS reference
# machine (docs/dos-reference.md) with P10's Sound Blaster: a Sound Blaster 2.0 at 220h,
# IRQ 7, DMA 1, its OPL2 the AdLib reference's (tools/pc_run.py --sb).

[sdl]
fullscreen = false
output = surface
autolock = false

[dosbox]
machine = svga_s3
memsize = 16
quit warning = false

[cpu]
core = normal
cputype = 386
cycles = fixed 30000
# removes only the real-time throttle (docs/dos-reference.md)
turbo = true

[mixer]
nosound = true

[sblaster]
sbtype = sb2
sbbase = 220
irq = 7
dma = 1
oplmode = opl2

[log]
logfile = dosbox-x.log
